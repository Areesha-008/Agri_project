name: jadeed-kashtkar

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: jadeed_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jadeed
      POSTGRES_PASSWORD: jadeed
      POSTGRES_DB: jadeed_kashtkar_db
    volumes:
      - jadeed_postgres_data:/var/lib/postgresql/data
    networks:
      - jadeed_network
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jadeed -d jadeed_kashtkar_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: jadeed_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://jadeed:jadeed@db:5432/jadeed_kashtkar_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - jadeed_backend_static:/app/static
    expose:
      - "8000"
    networks:
      - jadeed_network
      - shared_proxy_network
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # TODO: confirm this before building - see note below
        NEXT_PUBLIC_API_URL: http://<server-ip>/api/v1
        NEXT_PUBLIC_MAP_TILES_KEY: ${NEXT_PUBLIC_MAP_TILES_KEY}
    container_name: jadeed_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"  
    networks:
      - jadeed_network
      - shared_proxy_network
    mem_limit: 1g
    cpus: 1.0

networks:
  jadeed_network:
    name: jadeed_network
    driver: bridge
  shared_proxy_network:
    external: true

volumes:
  jadeed_postgres_data:
    name: jadeed_postgres_data
  jadeed_backend_static:
    name: jadeed_backend_static