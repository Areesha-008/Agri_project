name: jadeed-kashtkar

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: jadeed_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jadeed
      POSTGRES_PASSWORD: jadeed
      POSTGRES_DB: jadeed_kashtkar_db
    volumes:
      - jadeed_postgres_data:/var/lib/postgresql/data
    # NO ports section at all - db is never reachable from outside this
    # compose stack, not even from the server itself. Only 'backend' can
    # reach it, using the internal network, by name ("db").
    networks:
      - jadeed_network
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jadeed -d jadeed_kashtkar_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: jadeed_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://jadeed:jadeed@db:5432/jadeed_kashtkar_db
    depends_on:
      db:
        condition: service_healthy
    # Bound ONLY to localhost, on an unlikely-to-clash port (8001, not 8000).
    # Reachable only from inside the server itself (e.g. by Nginx),
    # never directly from the internet.
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - jadeed_backend_static:/app/static
    networks:
      - jadeed_network
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # IMPORTANT: update this to wherever Nginx will actually expose
        # your API publicly - see explanation below, this can no longer
        # be localhost:8000 once db/backend aren't directly public.
        NEXT_PUBLIC_API_URL: https://jadeedkashtkar.company.com/api/v1
        NEXT_PUBLIC_MAP_TILES_KEY: ${NEXT_PUBLIC_MAP_TILES_KEY}
    container_name: jadeed_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Also localhost-only, unlikely-to-clash port (3001, not 3000)
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - jadeed_network
    mem_limit: 1g
    cpus: 1.0

networks:
  jadeed_network:
    name: jadeed_network
    driver: bridge

volumes:
  jadeed_postgres_data:
    name: jadeed_postgres_data
  jadeed_backend_static:
    name: jadeed_backend_static